<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Featured projects, rotating: Curso de JavaScript, SecureDocs, Monito - Load Balancing, Tech Store, MediGuard">
  <title>Featured projects</title>
  <style>
    text { font-family: -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: 'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; }

    @keyframes creep { from { transform: translate(0,0); } to { transform: translate(-26px,26px); } }
    @keyframes dot   { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
    @keyframes ping  { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.9); opacity: 0; } }
    @keyframes breathe { 0%,100% { opacity: .22; } 50% { opacity: .5; } }

    @keyframes sl1 { 0%{opacity:1;transform:translateX(0)} 18.400%{opacity:1;transform:translateX(0)} 20.000%{opacity:0;transform:translateX(-26px)} 99.9%{opacity:0;transform:translateX(-26px)} 100%{opacity:1;transform:translateX(0)} }
@keyframes bar1 { 0%,18.400%{transform:scaleX(1)} 20.000%,99.9%{transform:scaleX(0)} 100%{transform:scaleX(1)} }
@keyframes gl1 { 0%,18.400%{opacity:1} 20.000%,99.9%{opacity:0} 100%{opacity:1} }
@keyframes sl2 { 0%{opacity:0;transform:translateX(26px)} 20.000%{opacity:0;transform:translateX(26px)} 20.300%{opacity:1;transform:translateX(0)} 38.400%{opacity:1;transform:translateX(0)} 40.000%{opacity:0;transform:translateX(-26px)} 100%{opacity:0;transform:translateX(26px)} }
@keyframes bar2 { 0%,20.000%{transform:scaleX(0)} 20.300%,40.000%{transform:scaleX(1)} 100%{transform:scaleX(0)} }
@keyframes gl2 { 0%,20.000%{opacity:0} 20.300%,38.400%{opacity:1} 40.000%,100%{opacity:0} }
@keyframes sl3 { 0%{opacity:0;transform:translateX(26px)} 40.000%{opacity:0;transform:translateX(26px)} 40.300%{opacity:1;transform:translateX(0)} 58.400%{opacity:1;transform:translateX(0)} 60.000%{opacity:0;transform:translateX(-26px)} 100%{opacity:0;transform:translateX(26px)} }
@keyframes bar3 { 0%,40.000%{transform:scaleX(0)} 40.300%,60.000%{transform:scaleX(1)} 100%{transform:scaleX(0)} }
@keyframes gl3 { 0%,40.000%{opacity:0} 40.300%,58.400%{opacity:1} 60.000%,100%{opacity:0} }
@keyframes sl4 { 0%{opacity:0;transform:translateX(26px)} 60.000%{opacity:0;transform:translateX(26px)} 60.300%{opacity:1;transform:translateX(0)} 78.400%{opacity:1;transform:translateX(0)} 80.000%{opacity:0;transform:translateX(-26px)} 100%{opacity:0;transform:translateX(26px)} }
@keyframes bar4 { 0%,60.000%{transform:scaleX(0)} 60.300%,80.000%{transform:scaleX(1)} 100%{transform:scaleX(0)} }
@keyframes gl4 { 0%,60.000%{opacity:0} 60.300%,78.400%{opacity:1} 80.000%,100%{opacity:0} }
@keyframes sl5 { 0%{opacity:0;transform:translateX(26px)} 80.000%{opacity:0;transform:translateX(26px)} 80.300%{opacity:1;transform:translateX(0)} 98.400%{opacity:1;transform:translateX(0)} 100.000%{opacity:0;transform:translateX(-26px)} 100%{opacity:0;transform:translateX(26px)} }
@keyframes bar5 { 0%,80.000%{transform:scaleX(0)} 80.300%,100.000%{transform:scaleX(1)} 100%{transform:scaleX(0)} }
@keyframes gl5 { 0%,80.000%{opacity:0} 80.300%,98.400%{opacity:1} 100.000%,100%{opacity:0} }

    .mesh  { animation: creep 5s linear infinite; }
    .dotb  { animation: dot 1.6s ease-in-out infinite; }
    .ghost { transform-box: fill-box; transform-origin: 50% 50%; animation: float 8s ease-in-out infinite; }
    .pingr { transform-box: fill-box; transform-origin: 50% 50%; animation: ping 2.4s cubic-bezier(.2,.7,.4,1) infinite; }

    .sl1 { opacity: 1; animation: sl1 10s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
.sl2 { opacity: 0; animation: sl2 10s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
.sl3 { opacity: 0; animation: sl3 10s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
.sl4 { opacity: 0; animation: sl4 10s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
.sl5 { opacity: 0; animation: sl5 10s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .glow1 { opacity: 1; animation: gl1 10s linear infinite, breathe 3.4s ease-in-out infinite; }
.glow2 { opacity: 0; animation: gl2 10s linear infinite, breathe 3.4s ease-in-out infinite; }
.glow3 { opacity: 0; animation: gl3 10s linear infinite, breathe 3.4s ease-in-out infinite; }
.glow4 { opacity: 0; animation: gl4 10s linear infinite, breathe 3.4s ease-in-out infinite; }
.glow5 { opacity: 0; animation: gl5 10s linear infinite, breathe 3.4s ease-in-out infinite; }
    .bar1 { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(1); animation: bar1 10s linear infinite; }
.bar2 { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: bar2 10s linear infinite; }
.bar3 { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: bar3 10s linear infinite; }
.bar4 { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: bar4 10s linear infinite; }
.bar5 { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: bar5 10s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .mesh,.dotb,.ghost,.pingr { animation: none; }
      .sl1, .sl2, .sl3, .sl4, .sl5 { animation: none; }
      .glow1, .glow2, .glow3, .glow4, .glow5 { animation: none; }
      .bar1, .bar2, .bar3, .bar4, .bar5 { animation: none; }
      .sl1,.glow1 { opacity: 1; } .bar1 { transform: scaleX(1); }
    }
  </style>
