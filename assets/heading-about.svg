<svg xmlns="http://www.w3.org/2000/svg" width="900" height="58" viewBox="0 0 900 58" role="img" aria-label="Section: ~/about">
  <title>~/about</title>
  <style>
    text { font-family: 'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; }
    .tilde { font-size: 24px; font-weight: 700; }
    .lbl   { font-size: 24px; font-weight: 700; fill: #ffffff; }

    @keyframes hue   { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes sweep { from { transform: translateX(-120px) skewX(-18deg); } to { transform: translateX(1020px) skewX(-18deg); } }
    @keyframes pulse { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -120; } }

    .hue   { animation: hue 6s linear infinite; }
    .cur   { animation: blink 1s step-end infinite; }
    .sweep { animation: sweep 6s cubic-bezier(.4,0,.5,1) infinite; }
    .bar   { stroke-dasharray: 10 14; animation: pulse 2.6s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .hue,.cur,.sweep,.bar { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="c"><rect width="900" height="58" rx="14"/></clipPath>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="900" height="58" fill="#0a0a0a"/>
    <rect class="sweep" x="-120" y="0" width="90" height="58" fill="#ffffff" opacity=".04"/>
    <g class="hue">
      <text class="tilde" x="30" y="37" fill="#58a6ff">~</text>
    </g>
    <text class="lbl" x="46" y="37">/about</text>
    <rect class="cur" x="127" y="19" width="11" height="22" fill="#ffffff" opacity=".85"/>
    <g class="hue">
      <rect x="30" y="50" width="840" height="2" rx="1" fill="url(#g)"/>
      <rect class="bar" x="30" y="50" width="840" height="2" rx="1" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="899" height="57" rx="14" fill="none" stroke="#333"/>
</svg>
