<svg xmlns="http://www.w3.org/2000/svg" width="260" height="56" viewBox="0 0 260 56" role="img" aria-label="View my portfolio">
  <title>View my portfolio</title>
  <style>
    text { font-family: -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; }
    @keyframes arrow { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
    @keyframes orbit { to { stroke-dashoffset: -1000; } }
    .arrow { animation: arrow 1.4s ease-in-out infinite; }
    .orbit { stroke-dasharray: 160 840; animation: orbit 5s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .arrow, .orbit { animation: none; } }
  </style>
  <rect width="260" height="56" rx="28" fill="#0a0a0a"/>
  <rect x=".5" y=".5" width="259" height="55" rx="27.5" fill="none" stroke="#444444"/>
  <rect class="orbit" x="1" y="1" width="258" height="54" rx="27" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" pathLength="1000"/>
  <text x="34" y="34">View my portfolio</text>
  <g class="arrow" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M206 28 H226"/><path d="M219 21 L226 28 L219 35"/>
  </g>
</svg>
