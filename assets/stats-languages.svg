<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Top languages by repository: JavaScript 26%, Python 17%, HTML 13%, Swift 13%, Java 9%, other 22%">
  <title>Top languages</title>
  <style>
    text { font-family: 'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; }
    .lbl { font-size: 13px; letter-spacing: 1.5px; font-weight: 600; }
    .pct { font-size: 13px; fill: #ffffff; font-weight: 600; }
    .hdr { font-size: 12px; letter-spacing: 3px; fill: #8a8a8a; }
    .big { font-size: 17px; letter-spacing: 3px; fill: #ffffff; font-weight: 600; }
    .ctr { fill: #8a8a8a; font-size: 11px; letter-spacing: 2px; text-anchor: middle; }
    .ctrN { fill: #ffffff; font-size: 26px; font-weight: 700; text-anchor: middle; }

    @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade   { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    @keyframes scan   { from { transform: translateY(-10px); } to { transform: translateY(330px); } }
    @keyframes pop    { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
    @keyframes orbit  { to { transform: rotate(360deg); } }
    @keyframes ctrfade{ from { opacity: 0; } to { opacity: 1; } }

    .meter { transform-box: fill-box; transform-origin: 0 50%; animation: grow 1.1s cubic-bezier(.3,0,.2,1) both; }
    .row { opacity: 0; animation: fade .5s ease-out both; }
    .scan { animation: scan 5.5s linear infinite; }
    .seg  { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; animation: pop .6s cubic-bezier(.3,1.4,.5,1) both; }
    .spin { transform-box: fill-box; transform-origin: 50% 50%; animation: orbit 30s linear infinite; }
    .ctext{ opacity: 0; animation: ctrfade .6s ease-out 1.3s both; }

    @media (prefers-reduced-motion: reduce) {
      .meter,.row,.scan,.seg,.spin,.ctext { animation: none; opacity: 1; }
      .meter { transform: none; }
    }
  </style>
  <defs>
    <clipPath id="p"><rect width="900" height="320" rx="14"/></clipPath>
    <linearGradient id="sg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#p)">
    <rect width="900" height="320" fill="#0a0a0a"/>

    <text class="hdr" x="30" y="34">TOP LANGUAGES</text>
    <text class="big" x="30" y="56">BY REPOSITORY</text>

    <!-- donut -->
    <g class="spin" transform="translate(150 178)">
      <circle r="88" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1" stroke-dasharray="2 10"/>
    </g>
    <g transform="translate(150 178) rotate(-90)">
      <circle r="70" fill="none" stroke="#21262d" stroke-width="26"/>
      <circle class="seg" r="70" fill="none" stroke="#f1e05a" stroke-width="26" stroke-dasharray="114.7 439.8" stroke-dashoffset="0"        style="animation-delay:.15s"/>
      <circle class="seg" r="70" fill="none" stroke="#3572A5" stroke-width="26" stroke-dasharray="76.5 439.8"  stroke-dashoffset="-114.7"  style="animation-delay:.30s"/>
      <circle class="seg" r="70" fill="none" stroke="#e34c26" stroke-width="26" stroke-dasharray="57.4 439.8"  stroke-dashoffset="-191.2"  style="animation-delay:.45s"/>
      <circle class="seg" r="70" fill="none" stroke="#ffac45" stroke-width="26" stroke-dasharray="57.4 439.8"  stroke-dashoffset="-248.6"  style="animation-delay:.60s"/>
      <circle class="seg" r="70" fill="none" stroke="#b07219" stroke-width="26" stroke-dasharray="38.2 439.8"  stroke-dashoffset="-306.0"  style="animation-delay:.75s"/>
      <circle class="seg" r="70" fill="none" stroke="#8b949e" stroke-width="26" stroke-dasharray="95.6 439.8"  stroke-dashoffset="-344.2"  style="animation-delay:.90s"/>
    </g>
    <g class="ctext">
      <text class="ctrN" x="150" y="172">6</text>
      <text class="ctr"  x="150" y="192">LANGUAGES</text>
    </g>

    <!-- lecturas -->
    <g class="row" style="animation-delay:0.50s">
      <rect x="2" y="-5" width="10" height="10" rx="2" fill="#f1e05a" transform="translate(330 94)"/>
      <text class="lbl" x="350" y="98" fill="#f1e05a">JAVASCRIPT</text>
      <rect x="500" y="91" width="240" height="7" rx="3.5" fill="#ffffff" fill-opacity=".12"/>
      <rect class="meter" x="500" y="91" width="240" height="7" rx="3.5" fill="#f1e05a" style="animation-delay:0.70s"/>
      <text class="pct" x="750" y="98">26%</text>
    </g>
    <g class="row" style="animation-delay:0.64s">
      <rect x="2" y="-5" width="10" height="10" rx="2" fill="#3572A5" transform="translate(330 124)"/>
      <text class="lbl" x="350" y="128" fill="#3572A5">PYTHON</text>
      <rect x="500" y="121" width="240" height="7" rx="3.5" fill="#ffffff" fill-opacity=".12"/>
      <rect class="meter" x="500" y="121" width="160" height="7" rx="3.5" fill="#3572A5" style="animation-delay:0.84s"/>
      <text class="pct" x="750" y="128">17%</text>
    </g>
    <g class="row" style="animation-delay:0.78s">
      <rect x="2" y="-5" width="10" height="10" rx="2" fill="#e34c26" transform="translate(330 154)"/>
      <text class="lbl" x="350" y="158" fill="#e34c26">HTML</text>
      <rect x="500" y="151" width="240" height="7" rx="3.5" fill="#ffffff" fill-opacity=".12"/>
      <rect class="meter" x="500" y="151" width="119" height="7" rx="3.5" fill="#e34c26" style="animation-delay:0.98s"/>
      <text class="pct" x="750" y="158">13%</text>
    </g>
    <g class="row" style="animation-delay:0.92s">
      <rect x="2" y="-5" width="10" height="10" rx="2" fill="#ffac45" transform="translate(330 184)"/>
      <text class="lbl" x="350" y="188" fill="#ffac45">SWIFT</text>
      <rect x="500" y="181" width="240" height="7" rx="3.5" fill="#ffffff" fill-opacity=".12"/>
      <rect class="meter" x="500" y="181" width="119" height="7" rx="3.5" fill="#ffac45" style="animation-delay:1.12s"/>
      <text class="pct" x="750" y="188">13%</text>
    </g>
    <g class="row" style="animation-delay:1.06s">
      <rect x="2" y="-5" width="10" height="10" rx="2" fill="#b07219" transform="translate(330 214)"/>
      <text class="lbl" x="350" y="218" fill="#b07219">JAVA</text>
      <rect x="500" y="211" width="240" height="7" rx="3.5" fill="#ffffff" fill-opacity=".12"/>
      <rect class="meter" x="500" y="211" width="80" height="7" rx="3.5" fill="#b07219" style="animation-delay:1.26s"/>
      <text class="pct" x="750" y="218">9%</text>
    </g>
    <g class="row" style="animation-delay:1.20s">
      <rect x="2" y="-5" width="10" height="10" rx="2" fill="#8b949e" transform="translate(330 244)"/>
      <text class="lbl" x="350" y="248" fill="#8b949e">OTHER</text>
      <rect x="500" y="241" width="240" height="7" rx="3.5" fill="#ffffff" fill-opacity=".12"/>
      <rect class="meter" x="500" y="241" width="200" height="7" rx="3.5" fill="#8b949e" style="animation-delay:1.40s"/>
      <text class="pct" x="750" y="248">22%</text>
    </g>
    <text x="330" y="276" font-size="11.5" fill="#666">Kotlin · TypeScript · C++ · Blade · CSS</text>

    <rect class="scan" x="0" y="-10" width="900" height="34" fill="url(#sg)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="319" rx="14" fill="none" stroke="#333"/>
</svg>
