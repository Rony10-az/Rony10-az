<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Status panel: backend, frontend, databases and DevOps progress readouts">
  <title>Workshop status</title>
  <style>
    text { font-family: 'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; }
    .lbl { font-size: 13px; letter-spacing: 2px; fill: #8a8a8a; }
    .pct { font-size: 13px; fill: #ffffff; text-anchor: end; }
    .hdr { font-size: 12px; letter-spacing: 3px; fill: #8a8a8a; }
    .big { font-size: 17px; letter-spacing: 3px; fill: #ffffff; font-weight: 600; }

    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes rspin  { to { transform: rotate(-360deg); } }
    @keyframes sweep  { to { transform: rotate(360deg); } }
    @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade   { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    @keyframes blip   { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes scan   { from { transform: translateY(-10px); } to { transform: translateY(250px); } }
    @keyframes drawc  { to { stroke-dashoffset: 0; } }

    .o1 { transform-origin: 160px 120px; animation: spin 18s linear infinite; }
    .o2 { transform-origin: 160px 120px; animation: rspin 11s linear infinite; }
    .o3 { transform-origin: 160px 120px; animation: sweep 4s linear infinite; }
    .core { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawc 1.6s ease-out .2s forwards; }
    .meter { transform-box: fill-box; transform-origin: 0 50%; animation: grow 1.1s cubic-bezier(.3,0,.2,1) both; }
    .row { opacity: 0; animation: fade .5s ease-out both; }
    .blip { animation: blip 1.8s ease-in-out infinite; }
    .scan { animation: scan 5s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .o1,.o2,.o3,.core,.meter,.row,.blip,.scan { animation: none; }
      .core { stroke-dashoffset: 0; } .row { opacity: 1; } .meter { transform: none; }
    }
  </style>
  <defs>
    <clipPath id="p"><rect width="900" height="240" rx="14"/></clipPath>
    <linearGradient id="sg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#p)">
    <rect width="900" height="240" fill="#0a0a0a"/>

    <!-- núcleo giratorio -->
    <g fill="none" stroke="#ffffff">
      <circle class="o1" cx="160" cy="120" r="78" stroke-opacity=".3" stroke-width="1.2" stroke-dasharray="4 10"/>
      <ellipse class="o2" cx="160" cy="120" rx="78" ry="28" stroke-opacity=".55" stroke-width="1.4"/>
      <ellipse class="o1" cx="160" cy="120" rx="28" ry="78" stroke-opacity=".35" stroke-width="1.2"/>
      <circle class="core" cx="160" cy="120" r="48" stroke-opacity=".9" stroke-width="2" pathLength="1"/>
      <g class="o3"><path d="M160 120 L160 56" stroke-opacity=".8" stroke-width="1.6"/></g>
    </g>
    <circle class="blip" cx="160" cy="120" r="7" fill="#ffffff"/>

    <!-- lecturas -->
    <text class="hdr" x="330" y="40">STATUS</text>
    <text class="big" x="330" y="62">SYSTEMS ONLINE</text>
    <g class="row" style="animation-delay:0.50s">
      <text class="lbl" x="330" y="98">BACKEND</text>
      <rect x="440" y="91" width="300" height="7" rx="3.5" fill="#ffffff" fill-opacity=".12"/>
      <rect class="meter" x="440" y="91" width="246" height="7" rx="3.5" fill="#ffffff" style="animation-delay:0.70s"/>
      <text class="pct" x="756" y="98">82%</text>
    </g>
    <g class="row" style="animation-delay:0.66s">
      <text class="lbl" x="330" y="128">FRONTEND</text>
      <rect x="440" y="121" width="300" height="7" rx="3.5" fill="#ffffff" fill-opacity=".12"/>
      <rect class="meter" x="440" y="121" width="222" height="7" rx="3.5" fill="#ffffff" style="animation-delay:0.86s"/>
      <text class="pct" x="756" y="128">74%</text>
    </g>
    <g class="row" style="animation-delay:0.82s">
      <text class="lbl" x="330" y="158">DATABASES</text>
      <rect x="440" y="151" width="300" height="7" rx="3.5" fill="#ffffff" fill-opacity=".12"/>
      <rect class="meter" x="440" y="151" width="189" height="7" rx="3.5" fill="#ffffff" style="animation-delay:1.02s"/>
      <text class="pct" x="756" y="158">63%</text>
    </g>
    <g class="row" style="animation-delay:0.98s">
      <text class="lbl" x="330" y="188">DEVOPS</text>
      <rect x="440" y="181" width="300" height="7" rx="3.5" fill="#ffffff" fill-opacity=".12"/>
      <rect class="meter" x="440" y="181" width="123" height="7" rx="3.5" fill="#ffffff" style="animation-delay:1.18s"/>
      <text class="pct" x="756" y="188">41%</text>
    </g>

    <!-- esquinas -->
    <g fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.6">
      <path d="M18 40 V18 H40"/><path d="M860 18 H882 V40"/>
      <path d="M18 200 V222 H40"/><path d="M860 222 H882 V200"/>
    </g>

    <rect class="scan" x="0" y="-10" width="900" height="34" fill="url(#sg)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="239" rx="14" fill="none" stroke="#333"/>
</svg>
