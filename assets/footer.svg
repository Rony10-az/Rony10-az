<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" role="img" aria-label="Rony10-az">
  <title>Rony10-az</title>
  <style>
    text { font-family: 'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; font-size: 13px; letter-spacing: 3px; fill: #fff; }
    @keyframes w1 { from { transform: translateX(0); }     to { transform: translateX(-450px); } }
    @keyframes w2 { from { transform: translateX(-450px); } to { transform: translateX(0); } }
    @keyframes w3 { from { transform: translateX(0); }     to { transform: translateX(-450px); } }
    @keyframes rise { from { transform: translateY(0); opacity:0; } 20% { opacity:.6; } to { transform: translateY(-120px); opacity:0; } }
    @keyframes glow { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    .wa { animation: w1 17s linear infinite; }
    .wb { animation: w2 11s linear infinite; }
    .wc { animation: w3 7s  linear infinite; }
    .b  { fill:#fff; animation-name: rise; animation-timing-function: linear; animation-iteration-count: infinite; }
    .tx { animation: glow 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .wa,.wb,.wc,.b,.tx { animation: none; } }
  </style>
  <defs><clipPath id="p"><rect width="900" height="160"/></clipPath></defs>
  <g clip-path="url(#p)">
    <circle class="b" cx="271" cy="150" r="1.7" style="animation-duration:8.6s;animation-delay:-4.3s"/>
    <circle class="b" cx="122" cy="150" r="1.3" style="animation-duration:7.0s;animation-delay:-8.3s"/>
    <circle class="b" cx="849" cy="150" r="3.0" style="animation-duration:5.3s;animation-delay:-4.7s"/>
    <circle class="b" cx="398" cy="150" r="1.7" style="animation-duration:5.9s;animation-delay:-1.0s"/>
    <circle class="b" cx="249" cy="150" r="2.9" style="animation-duration:5.1s;animation-delay:-5.8s"/>
    <circle class="b" cx="296" cy="150" r="2.6" style="animation-duration:6.0s;animation-delay:-2.8s"/>
    <circle class="b" cx="672" cy="150" r="2.8" style="animation-duration:9.8s;animation-delay:-7.6s"/>
    <circle class="b" cx="411" cy="150" r="1.4" style="animation-duration:8.0s;animation-delay:-6.0s"/>
    <circle class="b" cx="548" cy="150" r="1.6" style="animation-duration:6.2s;animation-delay:-2.5s"/>
    <circle class="b" cx="867" cy="150" r="2.8" style="animation-duration:7.7s;animation-delay:-2.7s"/>
    <g class="wa"><path fill="#1f1f1f" d="M0 62 Q112.5 34 225 62 T450 62 T675 62 T900 62 T1125 62 T1350 62 V160 H0 Z"/></g>
    <g class="wb"><path fill="#121212" d="M0 80 Q112.5 54 225 80 T450 80 T675 80 T900 80 T1125 80 T1350 80 V160 H0 Z"/></g>
    <g class="wc">
      <path fill="#000" d="M0 98 Q112.5 74 225 98 T450 98 T675 98 T900 98 T1125 98 T1350 98 V160 H0 Z"/>
      <path fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.2" d="M0 98 Q112.5 74 225 98 T450 98 T675 98 T900 98 T1125 98 T1350 98"/>
    </g>
    <text class="tx" x="450" y="138" text-anchor="middle">RONY10-AZ · BUILDING THINGS FOR THE WEB</text>
  </g>
</svg>
