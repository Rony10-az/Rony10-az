<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Hi, I'm RONY. Full Stack Developer, Software Engineering student at Tecsup.">
  <title>Hi, I'm RONY</title>
  <style>
    text { font-family: -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: 'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; }

    @keyframes drift   { from { transform: translate(0,0); }      to { transform: translate(-44px,44px); } }
    @keyframes fall    { from { transform: translateY(0); }        to { transform: translateY(640px); } }
    @keyframes beam    { from { transform: translateX(-340px); }   to { transform: translateX(1240px); } }
    @keyframes rise    { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes draw    { to { stroke-dashoffset: 0; } }
    @keyframes fillin  { from { fill-opacity: 0; } to { fill-opacity: 1; } }
    @keyframes jitter  { 0%,88%,100% { opacity:0; transform:translate(0,0); }
                          89% { opacity:.7; transform:translate(-6px,2px); }
                          92% { opacity:.5; transform:translate(5px,-3px); }
                          95% { opacity:.6; transform:translate(-3px,1px); } }
    @keyframes sub     { 0% { opacity:0; transform:translateY(12px); }
                          5%,21% { opacity:1; transform:none; }
                          26%,100% { opacity:0; transform:translateY(-8px); } }
    @keyframes floaty  { from { transform: translateY(0); opacity: 0; }
                          12% { opacity:.85; }
                          to { transform: translateY(-360px); opacity: 0; } }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes bounce  { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    @keyframes blink   { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes pulse   { 0%,100% { r: 5; opacity:1; } 50% { r: 8; opacity:.45; } }
    @keyframes breathe { 0%,100% { opacity:.07; } 50% { opacity:.16; } }

    .grid   { animation: drift 3.4s linear infinite; }
    .rain   { fill: #ffffff; fill-opacity: .13; font-size: 15px; animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
    .beam   { animation: beam 5.5s cubic-bezier(.5,0,.5,1) infinite; }
    .hi     { animation: rise .7s ease-out .15s both; }
    .name   { fill:#fff; fill-opacity:0; stroke:#fff; stroke-width:2; stroke-dasharray:1500; stroke-dashoffset:1500;
               animation: draw 2.1s ease-out .4s forwards, fillin .7s ease-out 2.2s forwards; }
    .ghost  { fill:#fff; opacity:0; animation: jitter 6s steps(1) 3.6s infinite; }
    .s      { opacity: 0; animation: sub 13s ease-in-out infinite; }
    .s1 { animation-delay: 2.8s; } .s2 { animation-delay: 6.05s; }
    .s3 { animation-delay: 9.3s; } .s4 { animation-delay: 12.55s; }
    .p      { fill:#fff; animation-name: floaty; animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring1  { transform-origin: 720px 170px; animation: spin 26s linear infinite; }
    .ring2  { transform-origin: 720px 170px; animation: spin 15s linear infinite reverse; }
    .ring3  { transform-origin: 720px 170px; animation: spin 9s linear infinite; }
    .node   { animation: pulse 2.2s ease-in-out infinite; }
    .eq     { fill:#fff; fill-opacity:.5; transform-box: fill-box; transform-origin: 50% 100%;
               animation-name: bounce; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .cur    { animation: blink 1s step-end infinite; }
    .halo   { animation: breathe 5s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .grid,.rain,.beam,.hi,.name,.ghost,.s,.p,.ring1,.ring2,.ring3,.node,.eq,.cur,.halo { animation: none; }
      .hi { opacity:1; } .name { stroke-dashoffset:0; fill-opacity:1; } .s1 { opacity:1; }
      .eq { transform: none; }
    }
  </style>

