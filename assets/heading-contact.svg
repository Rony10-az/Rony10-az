<svg xmlns="http://www.w3.org/2000/svg" width="900" height="58" viewBox="0 0 900 58" role="img" aria-label="Section: ~/contact">
  <title>~/contact</title>
  <style>
    text { font-family: 'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; }
    .tilde { font-size: 24px; font-weight: 700; fill: #ffffff; }
    .lbl   { font-size: 24px; font-weight: 700; fill: #ffffff; }

    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes sweep { from { transform: translateX(-120px) skewX(-18deg); } to { transform: translateX(1020px) skewX(-18deg); } }
    @keyframes dash  { to { stroke-dashoffset: -60; } }

    .cur   { animation: blink 1s step-end infinite; }
    .sweep { animation: sweep 6s cubic-bezier(.4,0,.5,1) infinite; }
    .line  { stroke-dasharray: 6 9; animation: dash 3s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .cur,.sweep,.line { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="c"><rect width="900" height="58" rx="14"/></clipPath>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8a8a8a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8a8a8a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="900" height="58" fill="#0a0a0a"/>
    <rect class="sweep" x="-120" y="0" width="90" height="58" fill="#ffffff" opacity=".04"/>
    <text class="tilde" x="30" y="37">~</text>
    <text class="lbl" x="46" y="37">/contact</text>
    <rect class="cur" x="157" y="19" width="11" height="22" fill="#ffffff" opacity=".85"/>
    <line class="line" x1="30" y1="50" x2="870" y2="50" stroke="#8a8a8a" stroke-opacity=".45" stroke-width="1.5"/>
    <rect x="30" y="49" width="840" height="2" rx="1" fill="url(#g)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="57" rx="14" fill="none" stroke="#333"/>
</svg>
