<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Weekly commit activity over the last 16 weeks, trending upward with a peak around week 11">
  <title>Weekly activity</title>
  <style>
    text { font-family: 'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; }
    .hdr { font-size: 12px; letter-spacing: 3px; fill: #8a8a8a; }
    .axis { font-size: 11px; fill: #6b6b6b; }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .bar { transform: scaleY(0); animation: grow .7s cubic-bezier(.2,.8,.3,1) forwards; }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; transform: scaleY(1); } }
  </style>
  <rect width="900" height="220" rx="14" fill="#0a0a0a"/>
  <text class="hdr" x="30" y="24">WEEKLY ACTIVITY &#183; LAST 16 WEEKS</text>
  <line x1="30" y1="186.5" x2="870" y2="186.5" stroke="#333"/>

    <rect class="bar" x="30.0" y="186" width="43.1" height="45.0" rx="2.5" fill="#ffffff" fill-opacity="0.50" style="animation-delay:0.00s" transform-origin="51.6 186"/>
