<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="About Rony: Software Engineering student at Tecsup, Peru. Full Stack Developer. Learning JavaScript, Docker and AWS. Based in Lima, interested in APIs, mobile and cloud. Contact ronnjhost@gmail.com">
  <title>About Rony</title>
  <style>
    text { font-family: 'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; font-size: 16px; }
    .k { fill: #8a8a8a; }
    .v { fill: #ffffff; }
    .tick { fill: #ffffff; }
    .hd { fill: #8a8a8a; font-size: 13px; letter-spacing: 2px; }

    @keyframes panelIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes fade { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
    @keyframes head { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rule { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

    .panel { transform-origin: 450px 190px; animation: panelIn .55s cubic-bezier(.22,.8,.3,1) both; }
    .row  { opacity: 0; animation: fade .62s cubic-bezier(.22,.8,.3,1) both; }
    .hdg  { animation: head .5s ease-out .1s both; }
    .line { transform-box: fill-box; transform-origin: 0 50%; animation: rule .8s cubic-bezier(.3,0,.2,1) .2s both; }
    .cur  { opacity: 0; animation: blink 1s step-end 2.1s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .panel,.row,.hdg,.line,.cur { animation: none; opacity: 1; }
      .panel { transform: none; } .line { transform: none; }
    }
  </style>
  <defs><clipPath id="p"><rect width="900" height="380" rx="14"/></clipPath></defs>
  <g class="panel" clip-path="url(#p)">
    <rect width="900" height="380" fill="#0a0a0a"/>
    <g class="hdg"><text class="hd" x="30" y="40">$ cat about.txt</text></g>
    <rect class="line" x="30" y="52" width="840" height="1" fill="#333"/>

    <g class="row" style="animation-delay:0.35s">
      <rect class="tick" x="30" y="61" width="3" height="20" rx="1.5"/>
      <text class="k" x="48" y="76">name</text>
      <text class="v" x="210" y="76">Rony</text>
    </g>
    <g class="row" style="animation-delay:0.57s">
      <rect class="tick" x="30" y="95" width="3" height="20" rx="1.5"/>
      <text class="k" x="48" y="110">studies</text>
      <text class="v" x="210" y="110">Software Engineering @ Tecsup, Peru</text>
    </g>
    <g class="row" style="animation-delay:0.79s">
      <rect class="tick" x="30" y="129" width="3" height="20" rx="1.5"/>
      <text class="k" x="48" y="144">role</text>
      <text class="v" x="210" y="144">Full Stack Developer (backend + frontend)</text>
    </g>
    <g class="row" style="animation-delay:1.01s">
      <rect class="tick" x="30" y="163" width="3" height="20" rx="1.5"/>
      <text class="k" x="48" y="178">learning</text>
      <text class="v" x="210" y="178">JavaScript · Docker · AWS  →  DevOps</text>
    </g>
    <g class="row" style="animation-delay:1.23s">
      <rect class="tick" x="30" y="197" width="3" height="20" rx="1.5"/>
      <text class="k" x="48" y="212">location</text>
      <text class="v" x="210" y="212">Lima, Peru</text>
    </g>
    <g class="row" style="animation-delay:1.45s">
      <rect class="tick" x="30" y="231" width="3" height="20" rx="1.5"/>
      <text class="k" x="48" y="246">interests</text>
      <text class="v" x="210" y="246">APIs · mobile (Swift/Kotlin) · cloud &amp; microservices</text>
    </g>
    <g class="row" style="animation-delay:1.67s">
      <rect class="tick" x="30" y="265" width="3" height="20" rx="1.5"/>
      <text class="k" x="48" y="280">open to</text>
      <text class="v" x="210" y="280">collaborating on web development projects</text>
    </g>
    <g class="row" style="animation-delay:1.89s">
      <rect class="tick" x="30" y="299" width="3" height="20" rx="1.5"/>
      <text class="k" x="48" y="314">contact</text>
      <text class="v" x="210" y="314">ronnjhost@gmail.com</text>
    </g>

    <text class="v cur" x="48" y="348">_</text>
  </g>
  <rect x=".5" y=".5" width="899" height="379" rx="14" fill="none" stroke="#333"/>
</svg>
