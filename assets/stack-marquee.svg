    text { font-family: 'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; font-size: 15px; font-weight: 600; fill: #fff; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1340.0px); } }
    @keyframes shine { 0%,100% { opacity:.35; } 50% { opacity:.9; } }
