<svg xmlns="http://www.w3.org/2000/svg" width="900" height="54" viewBox="0 0 900 54" role="img" aria-label="PHP, LARAVEL, MYSQL, NODE.JS, EXPRESS, JAVASCRIPT, TYPESCRIPT, REACT, PYTHON, JAVA, DOCKER, AWS, GIT">
  <title>Tech stack</title>
