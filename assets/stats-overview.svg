<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="GitHub stats: 28 public repositories, 233+ commits, 13 stars earned, top language JavaScript, coding since 2024">
  <title>GitHub stats</title>
  <style>
    text { font-family: 'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; font-size: 16px; }
    .k { fill: #8a8a8a; }
    .v { fill: #ffffff; font-weight: 700; }
    .u { fill: #8a8a8a; font-size: 13px; }
    .tick { fill: #ffffff; }
    .hd { fill: #8a8a8a; font-size: 13px; letter-spacing: 2px; }

    @keyframes fade { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
    @keyframes head { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rule { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes count { from { opacity: 0; transform: translateY(6px) scale(.85); } to { opacity: 1; transform: none; } }

    .row  { opacity: 0; animation: fade .62s cubic-bezier(.22,.8,.3,1) both; }
    .hdg  { animation: head .5s ease-out .1s both; }
    .line { transform-box: fill-box; transform-origin: 0 50%; animation: rule .8s cubic-bezier(.3,0,.2,1) .2s both; }
    .cur  { opacity: 0; animation: blink 1s step-end 1.9s infinite; }
    .num  { transform-box: fill-box; transform-origin: 0 50%; opacity: 0; animation: count .45s cubic-bezier(.3,1.4,.5,1) both; }

    @media (prefers-reduced-motion: reduce) {
      .row,.hdg,.line,.cur,.num { animation: none; opacity: 1; }
      .line { transform: none; }
    }
  </style>
  <defs><clipPath id="p"><rect width="900" height="280" rx="14"/></clipPath></defs>
  <g clip-path="url(#p)">
    <rect width="900" height="280" fill="#0a0a0a"/>
    <g class="hdg"><text class="hd" x="30" y="40">$ gh stats --user rony10-az</text></g>
    <rect class="line" x="30" y="52" width="840" height="1" fill="#333"/>

    <g class="row" style="animation-delay:0.35s">
      <rect class="tick" x="30" y="61" width="3" height="20" rx="1.5"/>
      <text class="k" x="48" y="76">repos</text>
      <text class="num v" x="210" y="76" style="animation-delay:0.55s">28</text>
      <text class="u" x="246" y="76">public repositories</text>
    </g>
    <g class="row" style="animation-delay:0.57s">
      <rect class="tick" x="30" y="95" width="3" height="20" rx="1.5"/>
      <text class="k" x="48" y="110">commits</text>
      <text class="num v" x="210" y="110" style="animation-delay:0.77s">233+</text>
      <text class="u" x="266" y="110">pushed across all repos</text>
    </g>
    <g class="row" style="animation-delay:0.79s">
      <rect class="tick" x="30" y="129" width="3" height="20" rx="1.5"/>
      <text class="k" x="48" y="144">stars</text>
      <text class="num v" x="210" y="144" style="animation-delay:0.99s">13</text>
      <text class="u" x="240" y="144">earned</text>
    </g>
    <g class="row" style="animation-delay:1.01s">
      <rect class="tick" x="30" y="163" width="3" height="20" rx="1.5"/>
      <text class="k" x="48" y="178">top_lang</text>
      <text class="num v" x="210" y="178" style="animation-delay:1.21s">JavaScript</text>
      <text class="u" x="356" y="178">· 26% of repos</text>
    </g>
    <g class="row" style="animation-delay:1.23s">
      <rect class="tick" x="30" y="197" width="3" height="20" rx="1.5"/>
      <text class="k" x="48" y="212">coding_since</text>
      <text class="num v" x="210" y="212" style="animation-delay:1.43s">2024</text>
      <text class="u" x="258" y="212">· Tecsup, Peru</text>
    </g>

    <text class="v cur" x="48" y="252">_</text>
  </g>
  <rect x=".5" y=".5" width="899" height="279" rx="14" fill="none" stroke="#333"/>
</svg>
